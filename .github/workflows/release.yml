name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish to NPM Registry
        run: |
          npm publish --workspace=@paladini/medium-publisher --access public
          npm publish --workspace=@paladini/tabnews-publisher --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@paladini'

      - name: Publish to GitHub Packages
        run: |
          npm publish --workspace=@paladini/medium-publisher
          npm publish --workspace=@paladini/tabnews-publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
